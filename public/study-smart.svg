<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <circle cx="650" cy="120" r="180" fill="#6366f1" opacity="0.15" filter="blur(50px)" />
  <circle cx="150" cy="380" r="140" fill="#a855f7" opacity="0.15" filter="blur(40px)" />
  
  <!-- Interface Card Mockup -->
  <rect x="120" y="80" width="560" height="340" rx="20" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />
  
  <!-- Card Header -->
  <rect x="150" y="110" width="12" height="12" rx="6" fill="#ef4444" opacity="0.8" />
  <rect x="170" y="110" width="12" height="12" rx="6" fill="#f59e0b" opacity="0.8" />
  <rect x="190" y="110" width="12" height="12" rx="6" fill="#10b981" opacity="0.8" />
  <text x="400" y="120" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Study Smart AI Planner</text>

  <!-- Content Block 1: Schedule timeline -->
  <rect x="150" y="150" width="230" height="95" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="170" y="180" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Calculus II Exam Prep</text>
  <rect x="170" y="195" width="150" height="6" rx="3" fill="#6366f1" />
  <text x="170" y="225" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="11">2h Focus Session &bull; Pomodoro</text>

  <!-- Content Block 2: AI Suggestion -->
  <rect x="400" y="150" width="250" height="210" rx="12" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
  <rect x="420" y="175" width="28" height="28" rx="8" fill="#4f46e5" fill-opacity="0.3" />
  <text x="434" y="194" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="16" text-anchor="middle">✦</text>
  <text x="460" y="193" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">AI Study Recommendation</text>
  <text x="420" y="230" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Review Chapter 4 integration</text>
  <text x="420" y="250" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">techniques before tomorrow.</text>
  <rect x="420" y="280" width="120" height="32" rx="16" fill="#6366f1" />
  <text x="480" y="301" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Start Quiz</text>

  <!-- Content Block 3: Progress Bar -->
  <rect x="150" y="265" width="230" height="95" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="170" y="295" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Weekly Target: 84%</text>
  <rect x="170" y="315" width="190" height="8" rx="4" fill="#334155" />
  <rect x="170" y="315" width="160" height="8" rx="4" fill="#10b981" />
  <text x="170" y="342" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">14 hours logged this week</text>
</svg>
