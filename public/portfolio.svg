<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <circle cx="200" cy="150" r="140" fill="#cbd5e1" opacity="0.4" filter="blur(50px)" />
  <circle cx="650" cy="350" r="160" fill="#94a3b8" opacity="0.3" filter="blur(60px)" />
  
  <!-- Browser Frame -->
  <rect x="110" y="70" width="580" height="360" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Browser Header -->
  <rect x="135" y="95" width="10" height="10" rx="5" fill="#f87171" />
  <rect x="152" y="95" width="10" height="10" rx="5" fill="#fbbf24" />
  <rect x="169" y="95" width="10" height="10" rx="5" fill="#34d399" />
  <rect x="220" y="90" width="360" height="22" rx="11" fill="#f1f5f9" />
  <text x="400" y="105" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">https://sussybungus.dev</text>
  
  <!-- Page Content: Sussy Bungus Portfolio -->
  <text x="150" y="170" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">Sussy Bungus.</text>
  <text x="150" y="200" fill="#64748b" font-family="-apple-system, sans-serif" font-size="14">Raymond Lin &bull; Student &amp; Developer</text>
  
  <!-- Floating Camera Mini Vector -->
  <rect x="420" y="150" width="220" height="140" rx="18" fill="#0f172a" />
  <circle cx="500" cy="220" r="35" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <circle cx="500" cy="220" r="18" fill="#38bdf8" fill-opacity="0.3" />
  <circle cx="600" cy="180" r="5" fill="#ef4444" />
  <rect x="580" y="205" width="35" height="12" rx="6" fill="#334155" />
  
  <!-- Badges -->
  <rect x="150" y="240" width="80" height="30" rx="15" fill="#0f172a" />
  <text x="190" y="260" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Projects</text>

  <rect x="240" y="240" width="80" height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="280" y="260" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">About</text>

  <!-- Tags footer -->
  <line x1="150" y1="310" x2="630" y2="310" stroke="#f1f5f9" stroke-width="1.5" />
  <text x="150" y="345" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Next.js &bull; Tailwind CSS &bull; GSAP &bull; Motion</text>
